log stderr all;
router id 192.168.1.252;

protocol device { scan time 10; }

# листы и community генерируются из /opt/bgp-routes/config.toml
include "/etc/bird/bgp-routes/out/protocols.conf";

protocol kernel {
  ipv4 {
    export none;
  };
}

protocol bgp vyos {
  local 192.168.1.252 as 65002;
  neighbor 192.168.1.251 as 65001;
  ipv4 {
    next hop self;
    export filter bgp_routes_export;
    import none;
  };
}
